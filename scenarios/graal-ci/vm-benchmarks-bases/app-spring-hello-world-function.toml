[scenario]
extends = [
    # Loads the specification for the local apps
    "../../templates/apps-local.toml",
]

[parameters]
app_base_dir = "."
app_binary_path = "spring-hello-world-function/app/build/native/nativeCompile/spring-hello-world-function"
app_type = {override = "function"}
# Calls the fixed Barista Spring hello-world handler and returns "Hello, World!".
app_endpoints = {override = ["/hello"]}
app_name = {override = "spring-hello-world-function"}
app_command = {override = {eval = "f'{app_base_dir}/{app_binary_path}'"}}
