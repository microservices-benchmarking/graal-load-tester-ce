[scenario]
name = "single-app-micronaut-similarity-function-2048"
extends = [
    # Load micronaut-similarity-function base
    "../../vm-benchmarks-bases/app-micronaut-similarity-function.toml",
    # Loads the specification for the single app load generators
    "../../../templates/load-generators-single-app.toml",
]
description = "Benchmarking of app running in dataplane: micronaut-similarity-function."
group = "single-app"
deployment = {eval = "app_deployment"}

[parameters]
app_deployment = {override = "nginx-tinyinit"}
app_memory = {override = 2048}
# TODO(GR-77511): Remove this workaround once tinyinit keeps the function available after nginx closes an idle upstream connection.
app_nginx_keepalive_timeout = {override = "600s"}
