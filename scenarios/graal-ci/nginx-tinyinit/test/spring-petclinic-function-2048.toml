[scenario]
name = "single-app-spring-petclinic-function-2048"
extends = [
    # Load spring-petclinic-function base
    "../../vm-benchmarks-bases/app-spring-petclinic-function.toml",
    # Loads the specification for the single app load generators
    "../../../templates/load-generators-single-app-test.toml",
]
description = "Benchmarking of app running in dataplane: spring-petclinic-function."
group = "single-app"
deployment = {eval = "app_deployment"}

[parameters]
app_deployment = {override = "nginx-tinyinit"}
app_memory = {override = 2048}
single_app_test_expects_body = {override = "\"visits_count=1\""}
